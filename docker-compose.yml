version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  response_generator:
    build: ./response_generator
    volumes:
      - ./data:/data
    ports:
      - "5001:5001"

  metrics:
    build: ./metrics
    volumes:
      - ./metrics_data:/metrics
    ports:
      - "5002:5002"

  cache_service:
    build: ./cache_service
    environment:
      - REDIS_HOST=redis
      - METRICS_URL=http://metrics:5002
      - RESPGEN_URL=http://response_generator:5001
      - CACHE_TTL=60
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - response_generator
      - metrics
    restart: on-failure

  kafka_producer:
    build: ./kafka_producer
    environment:
      - KAFKA_BROKER=kafka:9092
      - DISTRIBUTION=zipf
      - NUM_QUERIES=1000
      - ZIPF_S=1.5
    depends_on:
      - kafka
    volumes:
      - ./results:/results
    restart: on-failure

  kafka_consumer:
    build: ./kafka_consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - CACHE_URL=http://cache_service:5000
      - METRICS_URL=http://metrics:5002
      - MAX_RETRIES=3
      - FAIL_RATE=0.0
    depends_on:
      - kafka
      - cache_service
    volumes:
      - ./results:/results
    restart: on-failure

  retry_consumer:
    build: ./retry_consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - CACHE_URL=http://cache_service:5000
      - METRICS_URL=http://metrics:5002
      - MAX_RETRIES=3
    depends_on:
      - kafka
      - cache_service
    restart: on-failure

